<!DOCTYPE html> <!--serve para identificar a linguagem de programação que está sendo utilizada.-->
<html lang="pt-br"> <!-- abertura do documento, delimita o espaço de coodificação. Todas as tags devem ser colocadas nesse espaço.-->
<head> <!-- tag que define o cabeçalho do documento. Tudo o que for escrito dentro dessa tag não aparecerá na página principal. Dentro dessa tag, pode ser inserida folhas de estilos e script.-->
    <meta charset="UTF-8"> <!-- especificar qual o conjunto de caracteres (character set ou charset), será usado para renderizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metadados sobre a sua página-->
    <title>Portfólio</title> <!-- título da página-->
</head>
<body>
    
</body>
</html> <!-- fechamento da tag, documento.-->
